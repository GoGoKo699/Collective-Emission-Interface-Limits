name: Research verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up the reference Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"
      - name: Install pinned numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Test the reproduction comparator
        run: python tools/test_reproduction.py
      - name: Check preserved identities and local documentation links
        run: python verify.py --integrity-only
      - name: Capture the original runner for this audit
        run: |
          git fetch --no-tags --depth=1 origin 4ef1323a5288f24407270d59965b12aee6d6a6c0
          git show 4ef1323a5288f24407270d59965b12aee6d6a6c0:verify.py > legacy-verify.py
          python tools/capture_previous_runner.py --runner legacy-verify.py --capture-dir verification-legacy
          rm legacy-verify.py
      - name: Run all standalone scientific suites
        run: python verify.py --output verification-report.json --artifacts-dir verification-artifacts --require-reference
      - name: Confirm that reference evidence was not rewritten
        if: always()
        run: git diff --exit-code -- tests provenance/SUITES.json
      - name: Preserve raw outputs and field comparisons
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-evidence
          path: |
            verification-report.json
            verification-artifacts/
            verification-legacy/
          if-no-files-found: warn
          retention-days: 14
