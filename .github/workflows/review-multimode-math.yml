name: Review multimode revision mathematics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 22
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SCIENTIFIC_REVISION: '8616c3a93fb726c7363fa514726f0dc4f6c13008'
    steps:
      - name: Check out the scientific revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SCIENTIFIC_REVISION }}
          persist-credentials: false
      - name: Check out the pinned public math review tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: GoGoKo699/Quantum-Dark-Direction-Receiver
          ref: e11e9b9dd0fc3cc134390eeacb2674115485b92f
          path: math-review-tools
          persist-credentials: false
          sparse-checkout: verification/hosted_math
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install the capture runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/math-runtime" playwright@1.56.1 mathjax-full@3.2.1
          node "$RUNNER_TEMP/math-runtime/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Probe the live theorem and check the full reading route
        shell: bash
        run: |
          export NODE_PATH="$RUNNER_TEMP/math-runtime/node_modules"
          helper="$GITHUB_WORKSPACE/math-review-tools/verification/hosted_math"
          node "$helper/probe_hosted_math.cjs" \
            --root "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" \
            --revision "$SCIENTIFIC_REVISION" --page science/MULTIMODE_RECEIVER.md \
            --output "$RUNNER_TEMP/math-probe" || true
          pages=()
          while IFS= read -r p; do pages+=(--page "$p"); done < <(
            git ls-tree -r --name-only "$SCIENTIFIC_REVISION" -- README.md science/ learning/ references/ verification/README.md |
              awk '/\.md$/'
          )
          node "$helper/capture_hosted_math.cjs" \
            --root "$GITHUB_WORKSPACE" --repository "$GITHUB_REPOSITORY" \
            --revision "$SCIENTIFIC_REVISION" "${pages[@]}" \
            --output "$RUNNER_TEMP/hosted-math"
      - name: Preserve capture and comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: multimode-hosted-math
          path: |
            ${{ runner.temp }}/math-probe
            ${{ runner.temp }}/hosted-math
          if-no-files-found: warn
          retention-days: 14
